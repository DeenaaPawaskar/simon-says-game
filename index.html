<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simon says</title>
    <link rel="stylesheet" href="simonsays.css"/>
</head>
<body>
<div class="game">
    <h1>Focus Play</h1>
    <h3>Press any key to start the game</h3>
    <div class="button">
        <div class="line1">
            <div class="btn red" type="button" id="red">Red</div>
            <div class="btn yellow" type="button" id="yellow">Yellow</div>
        </div>
        <div class="line2">
            <div class="btn green" type="button" id="green">Green</div>
            <div class="btn purple" type="button" id="purple">Purple</div>
        </div>
    </div>

</div>

 <script src="simonsays.js"></script>
</body>
</html>
